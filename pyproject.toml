[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-export-parser"
version = "0.3.0"
description = "Local-first ChatGPT export parser and canonical SQLite archive library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/mlow-io/chatgpt-export-parser"

[project.scripts]
chatgpt-parser = "chatgpt_parser.cli.main:main"

[tool.setuptools.packages.find]
include = ["chatgpt_parser*"]
