[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasbench-parser"
version = "0.3.0"
description = "AtlasBench-owned ChatGPT export parser and canonical SQLite archive library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/mlow-io/atlasbench-parser"

[project.scripts]
atlasbench-parser = "chatgpt_parser.cli.main:main"

[tool.setuptools.packages.find]
include = ["chatgpt_parser*"]
